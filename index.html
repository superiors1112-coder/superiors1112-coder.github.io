<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>엑스칼리버 슬래시 - 클릭으로 유령·좀비 베기 게임</title>
<meta name="description" content="세상에서 가장 단단한 아만티움 엑스칼리버로 귀여운 유령과 좀비를 베는 무료 클릭 게임. 설치 없이 바로 플레이!">
<meta property="og:title" content="엑스칼리버 슬래시">
<meta property="og:description" content="클릭하면 검을 휘둘러 유령과 좀비를 벤다! 60초 동안 최고 점수에 도전하세요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
  :root{--bg:#0f0f1a;--panel:#1b1b2f;--accent:#ffd54a;--text:#f3f3f7;--muted:#9a9ab0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{display:flex;flex-direction:column;height:100%}
  header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--panel);font-size:14px}
  header b{color:var(--accent);font-size:16px}
  .ad{background:#141426;color:var(--muted);text-align:center;font-size:11px;padding:4px;min-height:0;display:none}
  .ad.on{display:block;min-height:50px}
  #stage{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;background:radial-gradient(ellipse at 50% 30%,#2a2550 0%,#0f0f1a 70%)}
  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;font-weight:700;font-size:18px;text-shadow:0 2px 4px #000}
  #combo{position:absolute;top:44px;left:0;right:0;text-align:center;pointer-events:none;color:var(--accent);font-weight:900;font-size:22px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .2s}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,10,20,.82);text-align:center;padding:20px}
  .overlay h1{font-size:30px;color:var(--accent);line-height:1.3}
  .overlay p{color:var(--muted);font-size:15px;line-height:1.6;max-width:420px}
  .overlay .big{font-size:48px;font-weight:900;color:#fff}
  button{background:var(--accent);color:#222;border:0;border-radius:12px;padding:14px 34px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #b8931b;transition:transform .05s}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #b8931b}
  .hidden{display:none}
  footer{padding:6px 14px;font-size:11px;color:var(--muted);text-align:center;background:var(--panel)}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div id="wrap">
  <header><b>⚔️ 엑스칼리버 슬래시</b><span>최고기록: <span id="best">0</span></span></header>
  <div class="ad" id="adTop">광고 영역 (상단)</div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><span>점수 <span id="score">0</span></span><span>⏱ <span id="time">60</span></span></div>
    <div id="combo"></div>
    <div class="overlay" id="start">
      <h1>아만티움 엑스칼리버로<br>유령과 좀비를 베어라!</h1>
      <p>화면을 <b>클릭(터치)</b>하면 검을 휘두릅니다.<br>👻 유령 +10점 · 🧟 좀비 +20점 · 💀 보스 +50점<br>연속으로 베면 콤보 보너스! 60초 안에 최고 점수를 노리세요.</p>
      <button id="btnStart">게임 시작</button>
    </div>
    <div class="overlay hidden" id="end">
      <h1>시간 종료!</h1>
      <div class="big" id="final">0</div>
      <p id="endMsg"></p>
      <button id="btnAgain">다시 하기</button>
    </div>
  </div>
  <div class="ad" id="adBottom">광고 영역 (하단)</div>
  <footer>© 2026 Excalibur Slash · 무료 미니게임 · 설치 없이 브라우저에서 바로 플레이</footer>
</div>
<script>
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  const $=id=>document.getElementById(id);
  let W=0,H=0,dpr=1;
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  window.addEventListener('resize',resize);resize();

  let best=0;try{best=+localStorage.getItem('xcal_best')||0}catch(e){}
  $('best').textContent=best;

  const GAME_TIME=60;
  let running=false,score=0,timeLeft=GAME_TIME,enemies=[],parts=[],slashes=[],combo=0,comboTimer=0,spawnTimer=0,last=0,shake=0;

  // ---- enemy types ----
  const TYPES={
    ghost:{r:22,pts:10,speed:60,hp:1,color:'#eef3ff'},
    zombie:{r:24,pts:20,speed:40,hp:1,color:'#8fd18f'},
    boss:{r:38,pts:50,speed:28,hp:3,color:'#c9a0ff'}
  };
  function spawn(){
    const roll=Math.random();
    const type=roll<0.1?'boss':roll<0.45?'zombie':'ghost';
    const t=TYPES[type];
    const side=Math.floor(Math.random()*4);
    let x,y;
    if(side===0){x=-t.r;y=Math.random()*H}else if(side===1){x=W+t.r;y=Math.random()*H}
    else if(side===2){x=Math.random()*W;y=-t.r}else{x=Math.random()*W;y=H+t.r}
    const tx=W*0.5+(Math.random()-0.5)*W*0.6,ty=H*0.5+(Math.random()-0.5)*H*0.6;
    const a=Math.atan2(ty-y,tx-x);
    const elapsed=GAME_TIME-timeLeft, sp=t.speed*(1+elapsed/60);
    enemies.push({type,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:t.r,hp:t.hp,bob:Math.random()*6.28,hit:0});
  }

  // ---- drawing ----
  function drawGhost(e){
    const {x,y,r}=e, bob=Math.sin(e.bob)*3;
    ctx.save();ctx.translate(x,y+bob);
    ctx.fillStyle=e.hit>0?'#fff':TYPES.ghost.color;
    ctx.beginPath();ctx.arc(0,-r*0.2,r,Math.PI,0);
    ctx.lineTo(r,r*0.7);
    for(let i=0;i<4;i++){ctx.quadraticCurveTo(r-(i*2+1)*r/4, r*0.9+(i%2?0:6), r-(i+1)*r/2, r*0.7);}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*0.35,-r*0.3,r*0.14,0,6.28);ctx.arc(r*0.35,-r*0.3,r*0.14,0,6.28);ctx.fill();
    ctx.fillStyle='#ffb3c6';ctx.beginPath();ctx.arc(-r*0.5,0,r*0.12,0,6.28);ctx.arc(r*0.5,0,r*0.12,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*0.2,0.2,2.9);ctx.stroke();
    ctx.restore();
  }
  function drawZombie(e){
    const {x,y,r}=e, sway=Math.sin(e.bob*2)*2;
    ctx.save();ctx.translate(x+sway,y);
    ctx.fillStyle='#4a6a4a';ctx.fillRect(-r*0.7,r*0.3,r*1.4,r*0.7);
    ctx.fillStyle=e.hit>0?'#fff':TYPES.zombie.color;
    ctx.beginPath();ctx.roundRect(-r*0.8,-r,r*1.6,r*1.5,r*0.3);ctx.fill();
    ctx.fillStyle='#2b3b2b';ctx.fillRect(-r*0.8,-r,r*1.6,r*0.35);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*0.35,-r*0.25,r*0.22,0,6.28);ctx.arc(r*0.35,-r*0.25,r*0.18,0,6.28);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*0.3,-r*0.25,r*0.1,0,6.28);ctx.arc(r*0.4,-r*0.25,r*0.08,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*0.4,r*0.2);ctx.lineTo(r*0.4,r*0.15);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(-r*0.1,r*0.15,r*0.15,r*0.15);
    ctx.fillStyle=TYPES.zombie.color;ctx.fillRect(-r*1.2,r*0.1,r*0.5,r*0.25);ctx.fillRect(r*0.7,r*0.1,r*0.5,r*0.25);
    ctx.restore();
  }
  function drawBoss(e){
    const {x,y,r}=e, bob=Math.sin(e.bob)*4;
    ctx.save();ctx.translate(x,y+bob);
    ctx.shadowColor='#c9a0ff';ctx.shadowBlur=20;
    ctx.fillStyle=e.hit>0?'#fff':TYPES.boss.color;
    ctx.beginPath();ctx.arc(0,-r*0.15,r,0,6.28);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#2a1a4a';ctx.beginPath();ctx.ellipse(-r*0.35,-r*0.25,r*0.2,r*0.26,0,0,6.28);ctx.ellipse(r*0.35,-r*0.25,r*0.2,r*0.26,0,0,6.28);ctx.fill();
    ctx.fillStyle='#ff5a7a';ctx.beginPath();ctx.arc(-r*0.35,-r*0.22,r*0.08,0,6.28);ctx.arc(r*0.35,-r*0.22,r*0.08,0,6.28);ctx.fill();
    ctx.fillStyle='#2a1a4a';for(let i=-2;i<=2;i++){ctx.fillRect(i*r*0.2-r*0.06,r*0.35,r*0.12,r*0.25);}
    ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.moveTo(-r*0.6,-r*0.9);ctx.lineTo(-r*0.4,-r*1.3);ctx.lineTo(-r*0.2,-r*0.95);ctx.lineTo(0,-r*1.35);ctx.lineTo(r*0.2,-r*0.95);ctx.lineTo(r*0.4,-r*1.3);ctx.lineTo(r*0.6,-r*0.9);ctx.closePath();ctx.fill();
    // hp pips
    for(let i=0;i<e.hp;i++){ctx.fillStyle='#ff5a7a';ctx.beginPath();ctx.arc((i-1)*12,r+12,4,0,6.28);ctx.fill();}
    ctx.restore();
  }
  function drawEnemy(e){ if(e.type==='ghost')drawGhost(e);else if(e.type==='zombie')drawZombie(e);else drawBoss(e); }

  function drawSword(s){
    const p=s.t/s.dur, ang=s.a0+(s.a1-s.a0)*p;
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ang);
    ctx.globalAlpha=1-p*0.6;
    // slash trail
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,s.len*0.85,-(s.a1-s.a0)*p,0.05);ctx.stroke();
    ctx.strokeStyle='rgba(120,200,255,.5)';ctx.lineWidth=16;ctx.beginPath();ctx.arc(0,0,s.len*0.85,-(s.a1-s.a0)*p*0.7,0.05);ctx.stroke();
    // blade
    const g=ctx.createLinearGradient(0,0,s.len,0);g.addColorStop(0,'#cfd8e8');g.addColorStop(0.5,'#ffffff');g.addColorStop(1,'#9fb4d6');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(s.len-18,-6);ctx.lineTo(s.len,0);ctx.lineTo(s.len-18,6);ctx.lineTo(0,6);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#5d7aa5';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(s.len-20,0);ctx.stroke();
    // guard + grip
    ctx.fillStyle='#ffd54a';ctx.fillRect(-4,-16,8,32);
    ctx.fillStyle='#6b3e1e';ctx.fillRect(-30,-5,26,10);
    ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(-34,0,7,0,6.28);ctx.fill();
    ctx.restore();
  }

  // ---- game logic ----
  function slash(x,y){
    if(!running)return;
    const len=Math.min(W,H)*0.28+40;
    const a0=-Math.PI*0.75,a1=Math.PI*0.35;
    slashes.push({x,y,len,a0,a1,t:0,dur:0.18});
    let killed=0;
    for(const e of enemies){
      const d=Math.hypot(e.x-x,e.y-y);
      if(d<=len*0.9+e.r){
        e.hp--;e.hit=0.12;
        if(e.hp<=0){e.dead=true;killed++;}
        else{shake=4;}
      }
    }
    if(killed>0){
      combo+=killed;comboTimer=1.4;
      const mult=1+Math.min(combo-1,9)*0.25;
      for(const e of enemies){ if(e.dead){ const pts=Math.round(TYPES[e.type].pts*mult); score+=pts; burst(e,pts);} }
      enemies=enemies.filter(e=>!e.dead);
      shake=6;
      const c=$('combo');c.textContent=combo>1?`${combo} COMBO! x${mult.toFixed(2)}`:'';c.style.opacity=combo>1?1:0;
      $('score').textContent=score;
    }else{ combo=0; $('combo').style.opacity=0; }
  }
  function burst(e,pts){
    const col=TYPES[e.type].color;
    // two halves
    parts.push({x:e.x-e.r*0.4,y:e.y,vx:-120,vy:-80,r:e.r*0.6,life:0.6,col,half:true});
    parts.push({x:e.x+e.r*0.4,y:e.y,vx:120,vy:-80,r:e.r*0.6,life:0.6,col,half:true});
    for(let i=0;i<10;i++){const a=Math.random()*6.28,v=80+Math.random()*160;parts.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*4,life:0.5+Math.random()*0.4,col});}
    parts.push({x:e.x,y:e.y-e.r,vy:-60,vx:0,life:0.9,text:'+'+pts});
  }

  function update(dt){
    if(running){
      timeLeft-=dt; if(timeLeft<=0){timeLeft=0;endGame();}
      $('time').textContent=Math.ceil(timeLeft);
      const elapsed=GAME_TIME-timeLeft;
      spawnTimer-=dt;
      if(spawnTimer<=0){spawn();spawnTimer=Math.max(0.25,0.9-elapsed*0.011);}
      if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=0;$('combo').style.opacity=0;}}
    }
    for(const e of enemies){
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.bob+=dt*4;if(e.hit>0)e.hit-=dt;
      if(e.x<-80||e.x>W+80||e.y<-80||e.y>H+80)e.gone=true;
    }
    enemies=enemies.filter(e=>!e.gone);
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.text)p.vy+=400*dt;p.life-=dt;}
    parts=parts.filter(p=>p.life>0);
    for(const s of slashes)s.t+=dt;
    slashes=slashes.filter(s=>s.t<s.dur);
    if(shake>0)shake=Math.max(0,shake-dt*40);
  }
  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    for(const e of enemies)drawEnemy(e);
    for(const p of parts){
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));
      if(p.text){ctx.fillStyle='#ffd54a';ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);}
      else{ctx.fillStyle=p.col;ctx.beginPath();if(p.half){ctx.arc(p.x,p.y,p.r,0,6.28);}else{ctx.arc(p.x,p.y,p.r,0,6.28);}ctx.fill();}
      ctx.globalAlpha=1;
    }
    for(const s of slashes)drawSword(s);
    ctx.restore();
  }
  function loop(ts){
    const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
    update(dt);render();requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function startGame(){
    score=0;timeLeft=GAME_TIME;enemies=[];parts=[];slashes=[];combo=0;spawnTimer=0;
    $('score').textContent=0;$('time').textContent=GAME_TIME;
    $('start').classList.add('hidden');$('end').classList.add('hidden');
    running=true;
  }
  function endGame(){
    running=false;
    $('final').textContent=score+'점';
    let msg='';
    if(score>best){best=score;try{localStorage.setItem('xcal_best',best)}catch(e){}$('best').textContent=best;msg='🏆 신기록 달성!';}
    else msg=`최고기록 ${best}점까지 ${best-score}점 남았어요.`;
    $('endMsg').textContent=msg;
    $('end').classList.remove('hidden');
  }
  $('btnStart').onclick=startGame;$('btnAgain').onclick=startGame;

  function pos(ev){const r=cv.getBoundingClientRect();const t=ev.touches?ev.touches[0]:ev;return [t.clientX-r.left,t.clientY-r.top];}
  cv.addEventListener('pointerdown',ev=>{ev.preventDefault();const [x,y]=pos(ev);slash(x,y);});
})();
</script>
</body>
</html>
