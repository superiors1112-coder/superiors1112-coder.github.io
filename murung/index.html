<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4c3b3">
<meta name="description" content="아이디, 나이, 성별만 입력하면 바로 들어가는 무릉도원. 눈사람 모습으로 함께 쉬어가세요.">
<title>무릉도원</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{--ink:#17322f;--mute:#56706c;--line:#d5e3df;--panel:#ffffff;--accent:#0f766e;--soft:#e6f4f2;--bad:#b91c1c;
    --display:"Do Hyeon","Noto Sans KR",sans-serif;--body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#84c796;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
  [hidden]{display:none!important}
  #stage{position:relative;width:100%;background:#f4c3b3}
  #cv{display:block;width:100%;cursor:pointer;touch-action:manipulation;outline:none}
  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;background:rgba(255,255,255,.86);font-size:12px;font-weight:500;padding:4px 11px;border-radius:999px}
  #say{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92%,640px);margin:0}
  #msg{width:100%;height:48px;margin:0;padding:0 22px;border:2px solid #f3a9c0;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(120,60,80,.18);font:inherit;font-size:16px;color:var(--ink)}
  #msg:focus{outline:none;border-color:#ee7fa3}
  @media (prefers-reduced-motion:no-preference){ #say:not([hidden]){animation:sayin .18s ease-out} }
  @keyframes sayin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  #bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
  .pose{flex:1 1 auto;max-width:180px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
  .pose[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .pose kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#f3f7f6}
  .pose.out{color:var(--bad)}
  .pose:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #gate{position:fixed;inset:0;display:flex;padding:16px;background:rgba(255,255,255,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
  .card{width:100%;max-width:380px;margin:auto;background:var(--panel);border-radius:18px;padding:20px 22px;box-shadow:0 18px 50px rgba(23,50,47,.22)}
  .card small{color:var(--mute);font-size:12px;letter-spacing:.3px}
  .card h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;margin:2px 0 6px}
  .card p{margin:0 0 16px;color:var(--mute);font-size:13px}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
  input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:16px;margin-bottom:12px;color:var(--ink);background:#fff}
  .seg{display:flex;gap:8px;margin-bottom:14px}
  .seg label{flex:1;margin:0}
  .seg input{position:absolute;opacity:0}
  .seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-weight:500}
  .seg input:checked+span{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  fieldset{border:0;padding:0;margin:0 0 14px;min-width:0}
  legend{font-size:13px;font-weight:500;margin-bottom:4px;padding:0}
  .chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chars label{margin:0;position:relative}
  .chars input{position:absolute;opacity:0}
  .chars .tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 7px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:12px;font-weight:500;background:#f6fbfa}
  .chars canvas{width:56px;height:56px;display:block}
  .chars .q{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:var(--accent)}
  .chars input:checked+.tile{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .chars input:focus-visible+.tile{outline:2px solid var(--accent);outline-offset:2px}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:wait}
  .err{background:#fee2e2;color:#991b1b;padding:9px 10px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .keys{margin:14px 0 0;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" tabindex="0" aria-label="무릉도원. 눈사람 모습의 접속자들이 쉬고 있는 공간"></canvas><div id="hud" hidden></div>
  <form id="say" hidden autocomplete="off"><input type="text" id="msg" maxlength="40" placeholder="하고 싶은 말을 쓰고 Enter (ESC 닫기)" aria-label="말풍선에 띄울 말" enterkeyhint="send"></form></div>
<div id="bar" hidden role="group" aria-label="자세">
  <button class="pose" data-pose="prone"><kbd>A</kbd>엎드리기</button>
  <button class="pose" data-pose="bow"><kbd>S</kbd>인사</button>
  <button class="pose" data-pose="meditate"><kbd>D</kbd>명상</button>
  <button class="pose" data-pose="stand"><kbd>F</kbd>일어서기</button>
  <button class="pose" id="talk"><kbd>Enter</kbd>말하기</button>
  <button class="pose out" id="lout"><kbd>ESC</kbd>로그아웃</button>
</div>
<div id="gate">
  <form class="card" id="form" autocomplete="off">
    <small>만남어플인데 진입장벽이 장난아님</small>
    <h1>무릉도원</h1>
    <p>회원가입 없이 아이디, 나이, 성별만 입력하면 바로 들어갑니다.</p>
    <div id="err"></div>
    <label for="nm">아이디 (한글 또는 영어, 10글자까지)</label>
    <input type="text" id="nm" maxlength="10" required>
    <label for="ag">나이 (만 19세 이상)</label>
    <input type="number" id="ag" min="19" max="99" inputmode="numeric" required>
    <div class="seg" role="radiogroup" aria-label="성별">
      <label><input type="radio" name="gd" value="M" required><span>남성</span></label>
      <label><input type="radio" name="gd" value="F"><span>여성</span></label>
    </div>
    <fieldset><legend>캐릭터</legend><div class="chars" id="chars"></div></fieldset>
    <button class="btn" id="go" type="submit">입장하기</button>
    <p class="keys">A 엎드리기 · S 인사 · D 명상 · F 일어서기 · Enter 말하기 · ESC 로그아웃<br>화면을 누르거나 방향키로 이동합니다.</p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
// ===== Supabase 설정: 프로젝트 설정 > API 에서 복사해 붙여넣기 (anon 키는 공개용 키입니다) =====
const SUPABASE_URL = "https://mtppvozkwhburnpuvamj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_OMAzy9jk9Yf50r64vz6z2Q_H3YNAyVQ";
const ROOM = "murung-lounge";
// ==========================================================================================
(function(){
const POSES={KeyA:'prone',KeyS:'bow',KeyD:'meditate',KeyF:'stand'};
// [몸x, 몸y, 몸가로, 몸세로, 머리x, 머리y] — 발끝이 (0,0)
const POSE_T={stand:[0,-18,18,18,0,-45],bow:[0,-18,18,18,16,-35],prone:[0,-11,25,11,32,-11],meditate:[0,-15,22,15,0,-41]};
const CH={
  monk:{name:'동자승',b:['#c3c9cc','#8f989d'],h:['#fde8d6','#f2cbae'],st:'rgba(110,90,80,.5)',arm:'#8f989d',aw:5},
  snow:{name:'눈사람',b:['#ffffff','#dde9f2'],h:['#ffffff','#dde9f2'],st:'rgba(110,140,165,.55)',arm:'#7a5a3c',aw:2.2},
  bear:{name:'곰돌이',b:['#e2b782','#bd8850'],h:['#e2b782','#bd8850'],st:'rgba(110,75,40,.5)',arm:'#bd8850',aw:5},
  chick:{name:'병아리',b:['#fff6ae','#f8d24a'],h:['#fff6ae','#f8d24a'],st:'rgba(170,130,30,.5)',arm:'#f2c53a',aw:5},
  bunny:{name:'토끼',b:['#ffffff','#f6dbe4'],h:['#ffffff','#f6dbe4'],st:'rgba(170,120,140,.5)',arm:'#efc9d5',aw:5}
};
const CH_KEYS=Object.keys(CH), isCh=c=>typeof c==='string'&&Object.prototype.hasOwnProperty.call(CH,c);
const G0=.66,G1=.94,SPEED=.28, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d'), stage=$('stage'), bar=$('bar'), gate=$('gate'), hud=$('hud');
const myKey=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());
const me={x:.5,y:.5,tx:.5,ty:.5,pose:'stand',face:1,name:'',age:0,gender:'M',c:'snow'};
let S={w:0,h:0,dpr:1,u:1,bg:null,geo:null}, anim={}, peers={}, inside=false, sb=null, ch=null, joinTimer=0, count=-1;
const petals=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),s:.6+Math.random(),ph:Math.random()*6.28}));

// ---------- 입장 ----------
$('chars').innerHTML=CH_KEYS.map(k=>`<label><input type="radio" name="ch" value="${k}"><span class="tile"><canvas width="112" height="112" data-ch="${k}"></canvas>${CH[k].name}</span></label>`).join('')+`<label><input type="radio" name="ch" value="random" checked><span class="tile"><span class="q">?</span>랜덤</span></label>`;
try{ const sv=JSON.parse(localStorage.getItem('murung_me')||'null'); if(sv){ const cr=document.querySelector(`input[name=ch][value="${isCh(sv.pick)?sv.pick:'random'}"]`); if(cr) cr.checked=true; $('nm').value=sv.name||''; $('ag').value=sv.age||''; const r=document.querySelector(`input[name=gd][value="${sv.gender==='F'?'F':'M'}"]`); if(r) r.checked=true; } }catch(e){}
const showErr=m=>{ $('err').innerHTML=''; if(m){ const d=document.createElement('div'); d.className='err'; d.textContent=m; $('err').appendChild(d); } };
$('form').addEventListener('submit',e=>{
  e.preventDefault(); showErr('');
  const name=$('nm').value.trim(), age=Math.floor(+$('ag').value), gender=(document.querySelector('input[name=gd]:checked')||{}).value;
  if(!/^[A-Za-z가-힣]{1,10}$/.test(name)) return showErr('아이디는 한글 또는 영어로 1~10글자만 쓸 수 있습니다. (띄어쓰기·숫자·기호 제외)');
  if(!(age>=19&&age<=99)) return showErr('나이는 19~99 사이 숫자로 입력해주세요.');
  if(gender!=='M'&&gender!=='F') return showErr('성별을 선택해주세요.');
  const pick=(document.querySelector('input[name=ch]:checked')||{}).value, c=isCh(pick)?pick:CH_KEYS[Math.floor(Math.random()*CH_KEYS.length)];
  Object.assign(me,{name,age,gender,c,pose:'stand',x:.25+Math.random()*.5,y:.15+Math.random()*.7}); me.tx=me.x; me.ty=me.y;
  try{ localStorage.setItem('murung_me',JSON.stringify({name,age,gender,pick:isCh(pick)?pick:'random'})); }catch(e){}
  connect();
});
function enter(){ inside=true; gate.hidden=true; bar.hidden=false; hud.hidden=false; fit(true); syncPose(); cv.focus({preventScroll:true}); }
function busy(on){ $('go').disabled=on; $('go').textContent=on?'접속 중…':'입장하기'; }

// ---------- 실시간 연결 (Supabase Realtime Presence) ----------
const payload=()=>({name:me.name,age:me.age,gender:me.gender,c:me.c,x:+me.tx.toFixed(3),y:+me.ty.toFixed(3),pose:me.pose});
function readPeers(){
  const st=ch.presenceState(), out={};
  for(const k of Object.keys(st)){ if(k===myKey) continue; const m=st[k]&&st[k][st[k].length-1]; if(!m) continue;
    if(typeof m.name!=='string'||typeof m.x!=='number'||typeof m.y!=='number') continue;
    out[k]={c:isCh(m.c)?m.c:'snow',name:m.name.slice(0,10),age:clamp(Math.floor(+m.age)||0,0,99),gender:m.gender==='F'?'F':'M',x:clamp(m.x,.04,.96),y:clamp(m.y,0,1),
      pose:(typeof m.pose==='string'&&Object.prototype.hasOwnProperty.call(POSE_T,m.pose))?m.pose:'stand'}; }
  peers=out;
}
function connect(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase){ enter(); hud.textContent='무릉도원 · 혼자 보기 (서버 미연결)'; count=-2; return; }
  busy(true);
  if(!sb) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:5}}});
  ch=sb.channel(ROOM,{config:{presence:{key:myKey}}});
  let tried=false;
  const tryJoin=async()=>{ if(tried||!ch) return; tried=true; clearTimeout(joinTimer); readPeers();
    if(Object.values(peers).some(p=>p.name.toLowerCase()===me.name.toLowerCase())){ leave(); busy(false); return showErr('이미 접속 중인 아이디입니다. 다른 아이디를 입력해주세요.'); }
    try{ await ch.track(payload()); busy(false); enter(); }catch(e){ leave(); busy(false); showErr('접속하지 못했습니다. 잠시 후 다시 시도해주세요.'); } };
  ch.on('presence',{event:'sync'},()=>{ readPeers(); if(!inside) tryJoin(); });
  ch.on('broadcast',{event:'say'},m=>{ const d=m&&m.payload; if(d&&typeof d.k==='string'&&typeof d.t==='string'&&peers[d.k]) bubbles[d.k]={text:d.t.slice(0,40),t0:performance.now()}; });
  ch.subscribe(st=>{
    if(st==='SUBSCRIBED'){ if(!inside) joinTimer=setTimeout(tryJoin,900); else send(true); }
    else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!inside){ leave(); busy(false); showErr('지금은 접속자가 많거나 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.'); }
  });
}
function leave(){ clearTimeout(joinTimer); if(ch){ const c=ch; ch=null; try{ c.untrack(); }catch(e){} try{ sb.removeChannel(c); }catch(e){} } peers={}; }
let lastSend=0, sendT=0;
function send(now){ if(!ch||!inside) return; clearTimeout(sendT); const wait=now?0:Math.max(0,350-(Date.now()-lastSend));
  sendT=setTimeout(()=>{ lastSend=Date.now(); if(ch) ch.track(payload()).catch(()=>{}); },wait); }
function logout(){ if(!inside) return; closeSay(); bubbles={}; inside=false; leave(); anim={}; bar.hidden=true; hud.hidden=true; gate.hidden=false; count=-1; busy(false); showErr(''); fit(true); $('nm').focus(); }
window.addEventListener('pagehide',()=>{ if(ch){ try{ ch.untrack(); }catch(e){} } });

// ---------- 조작 ----------
function syncPose(){ document.querySelectorAll('.pose[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pose===me.pose))); }
function setPose(p){ me.pose=p; me.tx=me.x; me.ty=me.y; syncPose(); send(); }
function walkTo(x,y){ me.tx=clamp(x,.04,.96); me.ty=clamp(y,0,1); if(me.pose!=='stand'){ me.pose='stand'; syncPose(); } send(); }
document.querySelectorAll('.pose[data-pose]').forEach(b=>b.onclick=()=>{ setPose(b.dataset.pose); cv.focus({preventScroll:true}); });
$('lout').onclick=logout;
cv.addEventListener('pointerdown',e=>{ if(!inside) return; const r=cv.getBoundingClientRect(); walkTo((e.clientX-r.left)/r.width,((e.clientY-r.top)/r.height-G0)/(G1-G0)); cv.focus({preventScroll:true}); });
// ---------- 말풍선 ----------
let bubbles={}, lastSay=0;
const sayBox=$('say'), msg=$('msg');
function openSay(){ if(!inside) return; sayBox.hidden=false; msg.value=''; msg.focus(); }
function closeSay(){ if(sayBox.hidden) return; sayBox.hidden=true; msg.blur(); if(inside) cv.focus({preventScroll:true}); }
function say(){ const t=msg.value.replace(/\s+/g,' ').trim().slice(0,40); closeSay(); if(!t) return; const n=Date.now(); if(n-lastSay<800) return; lastSay=n;
  bubbles[myKey]={text:t,t0:performance.now()}; if(ch) ch.send({type:'broadcast',event:'say',payload:{k:myKey,t}}).catch(()=>{}); }
sayBox.addEventListener('submit',e=>e.preventDefault());
msg.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.isComposing||e.keyCode===229) return;
  if(e.key==='Enter'){ e.preventDefault(); say(); } else if(e.key==='Escape'){ e.preventDefault(); closeSay(); } });
msg.addEventListener('blur',()=>{ if(!msg.value.trim()) setTimeout(()=>{ if(document.activeElement!==msg) sayBox.hidden=true; },150); });
$('talk').onclick=()=>{ if(sayBox.hidden) openSay(); else say(); };
function wrap(text,max){ const out=[]; let line=''; for(const c of text){ if(g.measureText(line+c).width>max&&line){ out.push(line); line=c.trimStart(); } else line+=c; } if(line) out.push(line); return out.slice(0,3); }
function bubble(x,y,sc,b,now){
  const D=5.5, age=(now-b.t0)/1000; if(age>D) return false;
  const q=Math.min(1,age/.28), k=reduce?1:1+2.7*Math.pow(q-1,3)+1.7*Math.pow(q-1,2), al=age>D-.5?(D-age)/.5:1, s=Math.max(.9,Math.min(1.25,sc));
  g.save(); g.translate(x,y+(reduce?0:Math.sin(now/420+x)*1.5)); g.scale(k*s,k*s); g.globalAlpha=Math.max(0,al);
  g.font='500 13px "Noto Sans KR",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  const lines=b.lines||(b.lines=wrap(b.text,150)), w=Math.max(34,Math.max(...lines.map(l=>g.measureText(l).width))+24), h=lines.length*18+14, top=-(h+9);
  g.fillStyle='#ffffff'; g.strokeStyle='#f3a9c0'; g.lineWidth=1.6; g.lineJoin='round';
  g.shadowColor='rgba(120,60,80,.18)'; g.shadowBlur=8; g.shadowOffsetY=3;
  g.beginPath(); if(g.roundRect) g.roundRect(-w/2,top,w,h,13); else g.rect(-w/2,top,w,h); g.fill(); g.shadowColor='transparent'; g.stroke();
  g.beginPath(); g.moveTo(-6,-9.6); g.lineTo(0,0); g.lineTo(6,-9.6); g.fill(); g.stroke(); g.fillRect(-5.2,-11.4,10.4,2.6);
  g.fillStyle='#3b2a35'; lines.forEach((l,i)=>g.fillText(l,0,top+7+9+i*18));
  g.restore(); return true;
}
document.addEventListener('keydown',e=>{
  if(!inside||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.code==='Enter'||e.code==='NumpadEnter'){ e.preventDefault(); openSay(); return; }
  if(e.code==='Escape'){ e.preventDefault(); logout(); return; }
  if(POSES[e.code]){ e.preventDefault(); setPose(POSES[e.code]); return; }
  const mv={ArrowLeft:[-.06,0],ArrowRight:[.06,0],ArrowUp:[0,-.12],ArrowDown:[0,.12]}[e.code];
  if(mv){ e.preventDefault(); walkTo(me.tx+mv[0],me.ty+mv[1]); }
});

// ---------- 그리기 ----------
function fit(force){
  const w=Math.floor(window.innerWidth), avail=window.innerHeight-(bar.hidden?0:bar.offsetHeight);
  const h=Math.round(Math.max(300,Math.min(avail,w*1.3))); if(!force&&w===S.w&&h===S.h) return;
  const dpr=Math.min(2,window.devicePixelRatio||1), hz=h*.56;
  cv.style.height=h+'px'; cv.width=w*dpr; cv.height=h*dpr;
  S={w,h,dpr,u:clamp(Math.min(w,h*1.6)/820,.72,1.3),bg:paintBg(w,h,dpr),geo:{cx:w*.2,ct:hz*.52,wb:hz+h*.035}};
}
window.addEventListener('resize',()=>fit());
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function paintBg(w,h,dpr){
  const c=document.createElement('canvas'); c.width=w*dpr; c.height=h*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr);
  const R=rng(11), hz=h*.56, mh=Math.min(h,w*.75); let gr;
